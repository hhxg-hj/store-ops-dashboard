<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>门店运营赋能 · 每日LTV快报</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --primary: #7c3aed; --primary-light: #f3e8ff;
      --accent: #e91e8c; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --text: #1e293b; --text2: #64748b; --border: #e8ebf0; --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .state-msg { text-align:center; padding:120px 20px; color:var(--text2); font-size:15px; }

    /* ===== Layout ===== */
    .shell { display:flex; min-height:100vh; }
    .sidebar {
      width:236px; flex-shrink:0; background:#fff; border-right:1px solid var(--border);
      display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    }
    .brand { padding:18px 20px 14px; font-weight:800; font-size:16px; color:var(--primary); display:flex; align-items:center; gap:8px; }
    .side-user { padding:16px 20px 16px; border-bottom:1px solid var(--border); margin-bottom:10px; display:flex; align-items:center; gap:12px; }
    .su-avatar {
      width:48px; height:48px; border-radius:14px; flex-shrink:0;
      background:linear-gradient(135deg,var(--primary),var(--accent));
      color:#fff; font-size:21px; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 5px 14px rgba(124,58,237,.32);
    }
    .su-info { min-width:0; }
    .su-name { font-size:19px; font-weight:800; color:var(--text); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .su-store { font-size:12px; color:var(--text2); margin-top:4px; }
    .su-meta { font-size:11px; color:var(--text2); margin-top:3px; }
    .nav { flex:1; padding:6px 12px; overflow:auto; }
    .nav-item {
      padding:11px 14px; border-radius:10px; margin:3px 0; cursor:pointer; font-size:14px;
      color:var(--text2); display:flex; align-items:center; gap:11px; transition:all .15s; user-select:none;
    }
    .nav-item:hover { background:var(--primary-light); color:var(--primary); }
    .nav-item.active { background:var(--primary); color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(124,58,237,.25); }
    .side-foot { padding:14px 20px; font-size:11px; color:var(--text2); border-top:1px solid var(--border); }
    .main { flex:1; display:flex; flex-direction:column; min-width:0; }
    .topbar {
      height:58px; background:#fff; border-bottom:1px solid var(--border); display:flex;
      align-items:center; justify-content:space-between; padding:0 22px; position:sticky; top:0; z-index:10;
    }
    .tb-name { font-size:13px; font-weight:700; }
    .tb-title { font-size:12px; color:var(--text2); margin-top:1px; }
    .tb-right { font-size:12px; color:var(--success); display:flex; align-items:center; gap:6px; }
    .tb-avatar {
      width:38px; height:38px; border-radius:11px;
      background:linear-gradient(135deg,var(--primary),var(--accent));
      color:#fff; font-size:16px; font-weight:800;
      display:none; align-items:center; justify-content:center;
      box-shadow:0 3px 10px rgba(124,58,237,.28);
    }
    .live-dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:pulse 1.6s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }
    .view { padding:20px 22px 40px; overflow:auto; flex:1; }

    .card { background:var(--card); border-radius:var(--radius); padding:18px 20px; box-shadow:0 1px 8px rgba(15,23,42,.05); margin-bottom:16px; }
    .view > .card:last-child { margin-bottom:0; }
    .section-title { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
    .section-title .icon { font-size:18px; }
    .section-title.plain { margin:18px 2px 6px; }

    /* 业绩奖励 */
    .reward-hero { text-align:center; padding:6px 0 2px; }
    .reward-amount { font-size:40px; font-weight:800; color:var(--accent); letter-spacing:-1px; }
    .reward-label { font-size:13px; color:var(--text2); }
    .rank-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .rank-item { background:var(--primary-light); border-radius:10px; padding:12px; text-align:center; }
    .rank-item .rank-num { font-size:15px; font-weight:700; color:var(--primary); }
    .rank-item .rank-label { font-size:11px; color:var(--text2); margin-top:4px; }

    /* KPI */
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:14px; }
    .kpi { background:#fff; border-radius:var(--radius); padding:16px 18px; box-shadow:0 1px 8px rgba(15,23,42,.05); border-left:3px solid var(--primary); }
    .kpi.accent { border-left-color:var(--accent); }
    .kpi.green { border-left-color:var(--success); }
    .kpi.orange { border-left-color:var(--warning); }
    .kpi-val { font-size:25px; font-weight:800; color:var(--text); line-height:1.1; }
    .kpi-lbl { font-size:12px; color:var(--text2); margin-top:6px; }
    .kpi-sub { font-size:11px; margin-top:6px; }

    /* 销售业绩 */
    .perf-table { width:100%; font-size:13px; border-collapse:collapse; }
    .perf-table th { text-align:left; color:var(--text2); font-weight:500; padding:7px 4px; border-bottom:1px solid var(--border); font-size:11px; }
    .perf-table td { padding:8px 4px; border-bottom:1px solid #f4f4f6; }
    .perf-table .section-row td { font-weight:700; padding-top:14px; font-size:14px; color:var(--primary); border-bottom:2px solid var(--primary-light); }
    /* 奶粉品类拆解 */
    .milk-cat-summary { display:flex; gap:10px; margin:10px 0 12px; }
    .milk-cat-summary .mcs-item { flex:1; background:var(--primary-light,#f0ebff); border-radius:10px; padding:10px 12px; text-align:center; }
    .milk-cat-summary .mcs-val { font-size:18px; font-weight:700; color:var(--primary); }
    .milk-cat-summary .mcs-lbl { font-size:11px; color:var(--text2); margin-top:2px; }
    .milk-cat-table { width:100%; font-size:13px; border-collapse:collapse; }
    .milk-cat-table th { text-align:left; color:var(--text2); font-weight:500; padding:7px 4px; border-bottom:1px solid var(--border); font-size:11px; }
    .milk-cat-table td { padding:9px 4px; border-bottom:1px solid #f4f4f6; vertical-align:middle; }
    .milk-cat-name { font-weight:600; white-space:nowrap; }
    .milk-share-bar { position:relative; background:#f0f0f4; border-radius:6px; height:16px; min-width:64px; overflow:hidden; }
    .milk-share-bar .bar { position:absolute; left:0; top:0; bottom:0; border-radius:6px; }
    .milk-share-bar .txt { position:relative; z-index:1; font-size:11px; line-height:16px; padding-left:6px; color:var(--text); }
    .milk-margin { font-weight:600; white-space:nowrap; }
    /* 每日行动建议 */
    .dap-head { display:flex; align-items:center; gap:8px; margin:4px 0 10px; }
    .dap-pill { font-size:11px; font-weight:700; padding:2px 10px; border-radius:999px; color:#fff; }
    .dap-pill.p0 { background:var(--danger); } .dap-pill.p1 { background:var(--warning); }
    .dap-pill.p2 { background:#3b82f6; } .dap-pill.p3 { background:var(--success); }
    .dap-headline { font-size:17px; font-weight:700; color:var(--text); }
    .dap-block { margin:10px 0; }
    .dap-block-title { font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; }
    .dap-evidence { background:#f8fafc; border-left:3px solid var(--primary); border-radius:0 8px 8px 0; padding:8px 12px; margin-bottom:6px; font-size:13px; }
    .dap-evidence b { color:var(--primary); }
    .dap-opportunity { background:var(--primary-light); border-radius:10px; padding:10px 12px; font-size:13px; }
    .dap-task { display:flex; gap:10px; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; align-items:flex-start; }
    .dap-task-num { flex:none; width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
    .dap-task-action { font-size:14px; font-weight:600; }
    .dap-task-def { font-size:12px; color:var(--text2); margin-top:3px; }
    .dap-task-refs { font-size:12px; color:var(--text2); margin-top:3px; }
    .dap-task-refs span { display:inline-block; background:#f0f0f4; border-radius:6px; padding:1px 7px; margin:2px 4px 0 0; }
    .dap-warn { font-size:11px; color:var(--text2); background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:6px 10px; margin-top:8px; }
    .dap-note { font-size:11px; color:var(--text2); margin-top:6px; }
    .mom { font-size:12px; }
    .mom-up { color:var(--danger); } .mom-down { color:var(--success); } .mom-none { color:var(--text2); }

    /* 用户服务 */
    .service-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
    .service-item { text-align:center; padding:14px 8px; background:#fafbff; border-radius:10px; }
    .service-item .sv { font-size:20px; font-weight:700; }
    .service-item .sl { font-size:11px; color:var(--text2); margin-top:4px; }
    .service-item .sm { font-size:10px; margin-top:3px; }

    /* 建议 / 洞察 */
    .suggestion { font-size:13px; line-height:1.8; white-space:pre-line; color:#334155; }
    .suggestion-item { padding:9px 13px; margin:5px 0; background:#fffbeb; border-left:3px solid var(--warning); border-radius:6px; }
    .insight-item { padding:11px 15px; margin:7px 0; background:#f8f6ff; border-left:3px solid var(--primary); border-radius:6px; font-size:13px; line-height:1.7; }

    /* 学习资源 */
    .lr-intro { font-size:13px; line-height:1.7; color:#334155; margin-bottom:12px; }
    .lr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
    .lr-card { border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#fff; }
    .lr-name { font-weight:600; font-size:13px; padding:9px 12px; background:#f8fafc; border-bottom:1px solid var(--border); }
    .lr-img { width:100%; display:block; }
    .lr-video { width:100%; display:block; background:#000; margin-top:8px; }
    .lr-links { display:flex; gap:8px; padding:9px 12px; flex-wrap:wrap; }
    .lr-link { font-size:12px; color:var(--primary); text-decoration:none; background:#eff6ff; padding:5px 11px; border-radius:7px; }
    .lr-link:hover { background:#dbeafe; }
    .lr-tip { font-size:12px; color:#64748b; margin-top:10px; line-height:1.6; }
    .lr-empty { font-size:13px; color:#94a3b8; padding:12px 0; }

    .refresh-info { text-align:center; font-size:11px; color:var(--text2); padding:8px 0 4px; }
    .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:20px; font-size:13px; cursor:pointer; z-index:999; display:none; }
    .toast.show { display:block; animation:slide .3s ease; }
    @keyframes slide { from { transform:translateX(-50%) translateY(-40px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }

    /* Follow-up */
    .followup-stats { display:flex; gap:8px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
    .fu-stat { text-align:center; padding:10px 16px; border-radius:9px; min-width:58px; cursor:pointer; transition:transform .15s, opacity .15s; opacity:.55; }
    .fu-stat:hover { opacity:.85; }
    .fu-stat.active { opacity:1; transform:scale(1.06); box-shadow:0 0 0 2px currentColor; }
    .fu-stat .fu-num { font-size:22px; font-weight:700; }
    .fu-stat .fu-lbl { font-size:10px; margin-top:2px; }
    .fu-stat.lost { background:#fef2f2; color:#dc2626; }
    .fu-stat.critical { background:#fff7ed; color:#ea580c; }
    .fu-stat.high { background:#fefce8; color:#ca8a04; }
    .fu-stat.medium { background:#f0fdf4; color:#16a34a; }
    .followup-list { margin-top:8px; }
    .fu-header, .fu-row { display:flex; align-items:center; padding:7px 8px; font-size:12px; }
    .fu-header { color:var(--text2); font-weight:600; border-bottom:2px solid var(--border); margin-bottom:4px; }
    .fu-row { border-bottom:1px solid #f6f6f8; border-radius:4px; }
    .fu-row.lost { background:#fef2f2; }
    .fu-row.critical { background:#fff7ed; }
    .fu-row.high { background:#fefce8; }
    .fu-row.medium { background:#f0fdf4; }

    /* 本周服务 */
    .task-item { display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid #f3f3f5; }
    .task-item:last-child { border-bottom:none; }
    .task-icon { font-size:18px; flex-shrink:0; width:28px; text-align:center; }
    .task-text { font-size:13px; line-height:1.6; }

    /* ===== Responsive (mobile) ===== */
    @media (max-width: 760px) {
      .shell { flex-direction:column; }
      .sidebar { width:100%; height:auto; position:static; flex-direction:row; align-items:center; border-right:none; border-bottom:1px solid var(--border); overflow-x:auto; padding:6px; }
      .brand, .side-user, .side-foot { display:none; }
      .nav { flex-direction:row; padding:0; overflow-x:auto; }
      .nav-item { white-space:nowrap; margin:0 4px; padding:9px 14px; font-size:13px; }
      .nav-item span { display:none; }
      .view { padding:14px 14px 36px; }
      .topbar { height:64px; padding:0 16px; }
      .tb-avatar { display:flex; }
      .tb-name { font-size:18px; font-weight:800; }
      .tb-title { font-size:11px; margin-top:2px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="state-msg">📊 加载中...</div>
  </div>
  <div class="toast" id="toast" onclick="bustedReload()">🔄 数据已更新，点击刷新 →</div>

<script>
const VERSION_URL = 'data/version.json';
const POLL = 60_000;
let _currentData = null;
let _currentView = 'overview';

function $(id) { return document.getElementById(id); }
function getParam(n) { return new URL(location.href).searchParams.get(n); }

// Base64 UTF-8 decode for URL id parameter
function decodeId(raw) {
  if (!raw) return null;
  try {
    const binary = atob(raw);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if (decoded && decoded.length > 0 && decoded.length < 50) return decoded;
  } catch(_) {}
  return raw;
}
function fmtPct(v, raw) { if (v == null || isNaN(v)) return '—'; const p = raw ? v * 100 : v; return (p >= 0 ? '↑' : '↓') + Math.abs(p).toFixed(1) + '%'; }
function fmtMoney(v) { if (v == null || isNaN(v)) return '¥0'; return '¥' + Number(v).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtNum(v) { if (v == null || isNaN(v)) return '0'; return Number(v).toLocaleString('zh-CN'); }
function momClass(v) { if (v == null || isNaN(v)) return 'mom-none'; return v >= 0 ? 'mom-up' : 'mom-down'; }
function momLabel(v) { if (v == null || isNaN(v)) return '—'; return fmtPct(v, true); }

const VIEW_TITLES = { overview:'运营概览', perf:'销售业绩', followup:'客户服务', action:'行动建议', learning:'学习资源' };
const VALID_VIEWS = ['overview','perf','followup','action','learning'];

/* ===== Shell ===== */
function buildShell(d) {
  $('app').innerHTML = `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">🚀 门店运营赋能</div>
      <div class="side-user">
        <div class="su-avatar">${(d.name || '店')[0]}</div>
        <div class="su-info">
          <div class="su-name">${d.name || '店员'}</div>
          <div class="su-store">🏪 ${d.store || '未知门店'}</div>
          <div class="su-meta">${d.region || ''} · ${d.zaidian ? '在店' : '离店'}</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-item" data-view="overview" onclick="navTo('overview')"><span>🏠</span>运营概览</div>
        <div class="nav-item" data-view="perf" onclick="navTo('perf')"><span>📈</span>销售业绩</div>
        <div class="nav-item" data-view="followup" onclick="navTo('followup')"><span>📞</span>客户服务</div>
        <div class="nav-item" data-view="action" onclick="navTo('action')"><span>💡</span>行动建议</div>
        <div class="nav-item" data-view="learning" onclick="navTo('learning')"><span>📚</span>学习资源</div>
      </nav>
      <div class="side-foot">🕐 每60秒自动更新 · v${d.version || '-'}</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:11px;">
          <div class="tb-avatar">${(d.name || '店')[0]}</div>
          <div>
            <div class="tb-name">${d.name || '店员'}${d.isManager ? ' · 👔' : ''}</div>
            <div class="tb-title" id="viewTitle">运营概览</div>
          </div>
        </div>
        <div class="tb-right"><span class="live-dot"></span> 实时</div>
      </div>
      <div class="view" id="view"></div>
    </main>
  </div>`;
}

function navTo(view) {
  if (!VALID_VIEWS.includes(view)) view = 'overview';
  _currentView = view;
  const url = new URL(location.href); url.hash = view; history.replaceState(null, '', url);
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  const vt = $('viewTitle'); if (vt) vt.textContent = VIEW_TITLES[view] || '';
  renderView(view);
  const main = document.querySelector('.main'); if (main) main.scrollTop = 0;
}

/* ===== Views ===== */
function renderOverview(d) {
  const sa = d.storeAgg || {};
  const storeRate = sa.achievementRate ? (sa.achievementRate*100).toFixed(1) + '%' : '—';
  const persRate = d.achievementRate ? (d.achievementRate*100).toFixed(1) + '%' : '—';
  const gapColor = v => (v>=0 ? 'var(--success)' : 'var(--warning)');

  // 用户指标统一目标：当月新增客户数（来自飞书「店员企微联系情况」表，按店员提取）。
  // 目标为 0 或未配置时显示「目标未设置」，避免除零。
  // 用户指标里只有「新增客户数」带目标：大礼堂店 90，其余店 120
  const userTarget = (d.store && String(d.store).includes('大礼堂')) ? 90 : 120;
  const newCustRate = d.newCustomers > 0 ? `${Math.round((d.newCustomers / userTarget) * 100)}%（目标 ${userTarget}）` : `0%（目标 ${userTarget}）`;

  return `
  <div class="card">
    <div class="section-title"><span class="icon">💰</span> 业绩奖励</div>
    <div class="reward-hero">
      <div class="reward-amount">${fmtMoney(d.commission)}</div>
      <div class="reward-label">本月业绩奖励</div>
    </div>
    <div class="rank-grid">
      <div class="rank-item">
        <div class="rank-num">🥇 第${d.storeRank}名 / ${d.storeTotal}人</div>
        <div class="rank-label">门店排名 · 榜首 ${d.storeTopName||'-'}</div>
        <div style="font-size:12px;margin-top:3px;color:${gapColor((d.commission||0)-(d.storeTopComm||0))}">差距 ¥${fmtNum(((d.storeTopComm||0)-(d.commission||0)).toFixed(0))}</div>
      </div>
      <div class="rank-item">
        <div class="rank-num">🏆 第${d.regionRank}名 / ${d.regionTotal}人</div>
        <div class="rank-label">区域排名 · 榜首 ${d.regionTopName||'-'}</div>
        <div style="font-size:12px;margin-top:3px;color:${gapColor((d.commission||0)-(d.regionTopComm||0))}">差距 ¥${fmtNum(((d.regionTopComm||0)-(d.commission||0)).toFixed(0))}</div>
      </div>
    </div>
  </div>

  <div class="section-title plain">📈 业绩指标</div>
  <div class="kpi-grid">
    <div class="kpi accent"><div class="kpi-val">${persRate}</div><div class="kpi-lbl">个人目标达成率</div><div class="kpi-sub" style="color:var(--text2)">目标 ¥${fmtNum(d.target)} · 达成 ¥${fmtNum(d.achieved)} · 门店均值 ${storeRate}</div></div>
    <div class="kpi"><div class="kpi-val">${fmtNum(d.milkCans)}</div><div class="kpi-lbl">奶粉销量 (罐)</div><div class="kpi-sub mom ${momClass(d.momMilkCans)}">环比 ${momLabel(d.momMilkCans)}</div></div>
    <div class="kpi"><div class="kpi-val">${fmtNum(d.pushCans)}</div><div class="kpi-lbl">主推销量 (罐)</div><div class="kpi-sub mom ${momClass(d.momPushCans)}">环比 ${momLabel(d.momPushCans)}</div></div>

/* ===== 每日行动建议引擎（确定性规则，见 store-ops-daily-action-advice-spec.md）===== */
const DAP_CONFIG = {
  maxTasksPerDay: 3, maxFollowupsPerDay: 5, minFollowupsPerDay: 2,
  thresholds: {
    clientMomDecline: -0.10, clientGrowthInsufficient: 0.10,
    visitRateGood: 0.80, visitRateCritical: 0.50,
    repurchaseLow: 0.15, aovDecline: -0.05, aovGrowthGood: 0.05,
    milkAvgLow: 2, replyRateLow: 80, firstReplySlowMinutes: 30,
  },
  quotas: { newLead: 3, unconvertedFollowup: 3, bundle: 3, referral: 3, feedback: 2 },
};
function dapHash(str) { let h = 5381; for (let i = 0; i < str.length; i++) { h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; } return h; }
function dapNormRate(v) {
  if (v === null || v === undefined || v === '' || isNaN(Number(String(v).replace('%','')))) return null;
  if (typeof v === 'string' && v.includes('%')) return Number(v.replace('%','')) / 100;
  const n = Number(v);
  if (Math.abs(n) > 1.5) return n / 100; // 视为百分数
  return n;
}
function dapBizDate() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai' }).format(new Date()); }
function dapMaskPhone(p) { const s = String(p || ''); return s.length >= 7 ? s.slice(0, 3) + '****' + s.slice(-4) : s; }
function dapPct(v, signed) { if (v === null || v === undefined) return '—'; const s = (v * 100).toFixed(1) + '%'; return signed && v > 0 ? '+' + s : s; }

function buildDailyActionPlan(d) {
  const T = DAP_CONFIG.thresholds;
  const date = dapBizDate();
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const remainingDays = Math.max(daysInMonth - now.getDate() + 1, 1);
  const warnings = [];

  // ── ctx 派生指标（分母为 0 → null，绝不当 0% 或 100%）──
  const visitRate = (d.visitShould > 0) ? d.visitDone / d.visitShould : null;
  if (d.visitShould === 0 || d.visitShould == null) warnings.push('应回访人数为 0，回访率未知（不影响按高风险客户清单触发任务）');
  const clientMom = (d.totalClientsLast > 0) ? (d.totalClients - d.totalClientsLast) / d.totalClientsLast : null;
  const milkClientMom = (d.milkClientsLast > 0) ? (d.milkClients - d.milkClientsLast) / d.milkClientsLast : null;
  const salesGap = Math.max((d.target || 0) - (d.achieved || 0), 0);
  const dailySalesGap = Math.ceil(salesGap / remainingDays);
  const repurchaseRate = dapNormRate(d.fugouRate);
  const aovMom = dapNormRate(d.kedanjiaQoq);
  const fu = d.followUp || {};
  const followupUrgent = (fu.lost || 0) + (fu.critical || 0) + (fu.high || 0);
  const list = Array.isArray(fu.list) ? fu.list : null;
  const monthProgress = now.getDate() / daysInMonth;

  // ── 今日回访对象（lost → critical → high → medium 排序）──
  const LEVEL_ORDER = { lost: 0, critical: 1, high: 2, medium: 3 };
  let todayRefs = [];
  if (list && list.length) {
    const sorted = [...list].sort((a, b) => (LEVEL_ORDER[a.level] ?? 9) - (LEVEL_ORDER[b.level] ?? 9) || (b.daysAgo || 0) - (a.daysAgo || 0));
    const base = d.visitPending > 0 ? Math.max(DAP_CONFIG.minFollowupsPerDay, Math.min(d.visitPending, DAP_CONFIG.maxFollowupsPerDay)) : Math.min(followupUrgent, DAP_CONFIG.maxFollowupsPerDay);
    todayRefs = sorted.slice(0, Math.min(base || 0, DAP_CONFIG.maxFollowupsPerDay));
  }
  const followupQuota = todayRefs.length || (d.visitPending > 0 ? Math.min(d.visitPending, DAP_CONFIG.maxFollowupsPerDay) : 0);

  // ── 候选场景 ──
  const candidates = [];
  // P0 / R3：存在高风险客户且回访未达标（visitRate 未知时按清单降级触发）
  const maintainAbnormal = (milkClientMom !== null && milkClientMom < 0) || (d.liushiUsers > 0) || (repurchaseRate !== null && repurchaseRate < T.repurchaseLow);
  if (followupUrgent > 0 && (visitRate === null || visitRate < T.visitRateGood)) {
    candidates.push({ scenario: 'R3_CUSTOMER_MAINTENANCE_VISIT_LOW', priority: 'P0', confidence: list ? 'high' : 'medium',
      headline: '今天优先召回高风险客户', opportunity: '唤醒沉睡客户，在客户完全流失前恢复联系，盘活存量用户资源',
      evidence: [
        { metric: '高风险客户', current: `${followupUrgent}人`, detail: `流失 ${fu.lost || 0} 人、高危 ${fu.critical || 0} 人、紧急 ${fu.high || 0} 人` },
        { metric: '回访完成率', current: visitRate === null ? '未知' : dapPct(visitRate), detail: visitRate === null ? '应回访人数为 0，按高风险清单直接触发' : `已回 ${d.visitDone} / 应回 ${d.visitShould}，待回 ${d.visitPending}` },
      ] });
  }
  // P1 / R4+R7 合并：回访达标（或无回访任务）但复购偏低 / 客户维护信号弱
  if (repurchaseRate !== null && repurchaseRate < T.repurchaseLow && !(followupUrgent > 0 && (visitRate === null || visitRate < T.visitRateGood))) {
    const ev = [{ metric: '本月复购用户占比', current: dapPct(repurchaseRate), detail: `低于阈值 ${dapPct(T.repurchaseLow)}；仅有本月数据，只判断“偏低”，非“下降”` }];
    if (milkClientMom !== null && milkClientMom < 0) ev.push({ metric: '奶粉客户数', current: `${d.milkClients}人`, detail: `上月 ${d.milkClientsLast} 人，环比 ${dapPct(milkClientMom, true)}` });
    if (d.liushiUsers > 0) ev.push({ metric: '本月流失用户', current: `${d.liushiUsers}人`, detail: '存在流失，需要提前干预' });
    candidates.push({ scenario: 'R4R7_REPURCHASE_LOW', priority: 'P1', confidence: 'high',
      headline: '今天聚焦存量客户复购', opportunity: '抓住客户消费周期，提前补货提醒 + 需求匹配，增强老客户消费意愿', evidence: ev });
  }
  // P1 / R1：下单客户下降（代理指标）
  if (clientMom !== null && clientMom <= T.clientMomDecline) {
    const ev = [{ metric: '本月下单客户', current: `${d.totalClients}人`, detail: `上月 ${d.totalClientsLast} 人，环比 ${dapPct(clientMom, true)}（此字段暂作客户流量代理指标）` }];
    if (d.sankeUsers < d.sankeUsersLast) ev.push({ metric: '散客用户', current: `${d.sankeUsers}人`, detail: `上月 ${d.sankeUsersLast} 人，同步走弱` });
    candidates.push({ scenario: 'R1_CLIENT_DECLINE', priority: 'P1', confidence: 'medium',
      headline: '今天重点补充新客源', opportunity: '挖掘外部增量客源，扩充门店潜在客户池', evidence: ev });
  }
  // P2 / R2：客户增长但不足（降级：“增长不足”，不说“增速放缓”）
  if (clientMom !== null && clientMom > 0 && clientMom < T.clientGrowthInsufficient) {
    candidates.push({ scenario: 'R2_CLIENT_GROWTH_INSUFFICIENT', priority: 'P2', confidence: 'medium',
      headline: '客户仍在增长，今天优化新客转化', opportunity: '减少引流后的流失，提高新客转化率',
      evidence: [{ metric: '本月下单客户', current: `${d.totalClients}人`, detail: `上月 ${d.totalClientsLast} 人，环比 ${dapPct(clientMom, true)}，增长幅度低于 ${dapPct(T.clientGrowthInsufficient)}（两期数据仅能判断增长不足）` }] });
  }
  // P2 / R5：客单价下降
  if (aovMom !== null && aovMom <= T.aovDecline) {
    candidates.push({ scenario: 'R5_AOV_DECLINE', priority: 'P2', confidence: 'medium',
      headline: '今天抓单笔订单产出', opportunity: '抓住每一笔成交，通过连带推荐提高单笔订单产出',
      evidence: [{ metric: '全品类客单价', current: `¥${(d.kedanjia || 0).toFixed(0)}`, detail: `上月环比 ${dapPct(aovMom, true)}，低于 ${dapPct(T.aovDecline)} 阈值` }] });
  }
  // P2：业绩追赶
  if (d.target > 0 && (d.achievementRate || 0) < monthProgress && salesGap > 0) {
    candidates.push({ scenario: 'P2_SALES_CATCHUP', priority: 'P2', confidence: 'high',
      headline: '今天聚焦销售目标追赶', opportunity: '把月度缺口拆解为当天可完成的销售动作',
      evidence: [{ metric: '目标达成率', current: dapPct(d.achievementRate), detail: `月进度 ${dapPct(monthProgress)}；缺口 ¥${salesGap.toFixed(0)}，剩余 ${remainingDays} 天日均需 ¥${dailySalesGap}` }] });
  }
  // P3 / R6：客单价上涨（复盘沉淀）
  if (aovMom !== null && aovMom >= T.aovGrowthGood) {
    candidates.push({ scenario: 'R6_AOV_GOOD', priority: 'P3', confidence: 'medium',
      headline: '客单价上涨，今天沉淀方法', opportunity: '复制成功经验，把个人打法变成门店打法',
      evidence: [{ metric: '全品类客单价', current: `¥${(d.kedanjia || 0).toFixed(0)}`, detail: `上月环比 ${dapPct(aovMom, true)}（仅两期数据，表述为“上涨”）` }] });
  }

  // ── 优先级排序，选一个主场景 ──
  const PRIORITY_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  candidates.sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
  let primary = candidates[0] || null;
  if (!primary) {
    primary = { scenario: 'KEEP_STEADY', priority: 'P3', confidence: 'high',
      headline: '指标健康，今天做好保持动作', opportunity: '巩固服务质量，沉淀成功经验',
      evidence: [{ metric: '异常规则', current: '未触发', detail: '当前各项指标未命中任何异常场景' }] };
  }

  // ── 生成今日任务（最多 3 个；P0 客户清单优先于轮换）──
  const rot = (n) => dapHash(d.name + '|' + date + '|' + primary.scenario) % n;
  const Q = DAP_CONFIG.quotas;
  const tasks = [];
  const refs = todayRefs.map(c => `${dapMaskPhone(c.phone)}（${c.urgency}·${c.daysAgo}天未购）`);

  if (primary.scenario === 'R3_CUSTOMER_MAINTENANCE_VISIT_LOW') {
    tasks.push({ order: 1, action: `完成 ${followupQuota || followupUrgent} 位高优先级客户回访（电话或企微）`, targetRefs: refs,
      completionDefinition: '每位填写「未购买原因、当前需求、下次跟进时间」三项，缺一不算完成；无法接通改企微留言并标记再联系时间', sourceRule: 'R3' });
    const support = [
      { action: `从今日回访对象中选 ${Math.min(3, followupQuota || 3)} 位，先查历史消费记录再做个性化沟通`, completionDefinition: '记录客户反馈；无历史记录数据时不虚构偏好', sourceRule: 'R4' },
      { action: `对 ${Q.feedback} 位客户收集不满意点或未购买原因并同步店长`, completionDefinition: '每条原因需为客户原话记录，不做主观归因', sourceRule: 'R4' },
      { action: '从「本周」清单中挑出临近预测补货日期的客户，提前发补货提醒', completionDefinition: '发送记录可查，标记客户回复状态', sourceRule: 'R7' },
    ];
    tasks.push({ order: 2, ...support[rot(support.length)] });
  } else if (primary.scenario === 'R4R7_REPURCHASE_LOW') {
    const pool = [
      { action: `优先联系「本周」清单中接近预测补货日期的客户（最多 ${DAP_CONFIG.maxFollowupsPerDay} 位）`, targetRefs: refs.slice(0, DAP_CONFIG.maxFollowupsPerDay), completionDefinition: '核对补货周期并设置提醒，记录客户回复', sourceRule: 'R7' },
      { action: `向 ${Q.bundle} 位符合条件的老会员说明专属福利或周期复购权益`, completionDefinition: '记录「已说明/感兴趣/暂不考虑」三态结果', sourceRule: 'R4' },
      { action: '对近期成交客户完成售后使用体验跟进', completionDefinition: `至少 ${Q.feedback} 位，记录使用反馈与下次跟进时间`, sourceRule: 'R7' },
      { action: '发布或私发 1 条与目标客户需求相关的育儿知识', completionDefinition: '无客户需求数据时选通用主题，不声称精准匹配', sourceRule: 'R7' },
    ];
    const i = rot(pool.length);
    tasks.push({ order: 1, ...pool[i] });
    tasks.push({ order: 2, ...pool[(i + 1) % pool.length] });
  } else if (primary.scenario === 'R1_CLIENT_DECLINE') {
    const pool = [
      { action: `到店登记：完整登记至少 ${Q.newLead} 位新客的联系方式、宝宝月龄、核心需求，并全部添加企微`, completionDefinition: `${Q.newLead} 位信息完整且企微添加成功`, sourceRule: 'R1' },
      { action: `未成交跟进：选择 ${Q.unconvertedFollowup} 位未成交客户，一对一了解未下单原因并记录`, completionDefinition: '每位记录未下单原因原话；项目无名单时按门店实际名单执行，不虚构客户', sourceRule: 'R1' },
      { action: '线下拓客：完成一次社区/异业触点执行', completionDefinition: '记录触达人数和新增企微数', sourceRule: 'R1' },
      { action: '线上获客：发布 1 条本地母婴短内容或参与 1 次直播承接', completionDefinition: '记录曝光/咨询数', sourceRule: 'R1' },
      { action: `老带新宣导：向 ${Q.referral} 位服务满意的老客讲解老带新政策（固定运营动作，非裂变率异常触发）`, completionDefinition: '记录「已介绍/愿意推荐/暂不考虑」', sourceRule: 'R8-固定' },
    ];
    tasks.push({ order: 1, ...pool[rot(pool.length)] });
  } else if (primary.scenario === 'R2_CLIENT_GROWTH_INSUFFICIENT') {
    const pool = [
      { action: `跟进 ${Q.unconvertedFollowup} 位近期未成交新客，记录未下单原因`, completionDefinition: '每位有原因记录', sourceRule: 'R2' },
      { action: '演练并实际使用一次新客体验套餐/新人优惠标准话术', completionDefinition: '记录使用场景与客户反应', sourceRule: 'R2' },
      { action: '复盘本月转化最好的一个获客渠道，向店长提交一条可复制做法', completionDefinition: '提交一条书面可复制做法', sourceRule: 'R2' },
    ];
    tasks.push({ order: 1, ...pool[rot(pool.length)] });
  } else if (primary.scenario === 'R5_AOV_DECLINE') {
    tasks.push({ order: 1, action: `完成 ${Q.bundle} 次关联商品推荐`, completionDefinition: '记录推荐商品、客户反馈、最终是否成交；不以勾选「已推荐」为完成', sourceRule: 'R5' });
    const support = [
      { action: '每笔主推商品成交时主动介绍一次组合套餐或满减方案', completionDefinition: '记录介绍次数与结果', sourceRule: 'R5' },
      { action: '选择一个高客单商品，用「需求—优势—适用场景」三句话向客户完成介绍', completionDefinition: '至少完成 1 次并记录客户反应', sourceRule: 'R5' },
    ];
    tasks.push({ order: 2, ...support[rot(support.length)] });
  } else if (primary.scenario === 'P2_SALES_CATCHUP') {
    tasks.push({ order: 1, action: `今天需关注销售产出约 ¥${dailySalesGap}（月缺口 ¥${salesGap.toFixed(0)} ÷ 剩余 ${remainingDays} 天）`, completionDefinition: '此为当天关注值，不拆给单一客户；闭店前核对当日实际销售', sourceRule: 'P2' });
    tasks.push({ order: 2, action: `完成 ${Q.bundle} 次连带推荐提高单笔产出`, completionDefinition: '记录推荐商品与结果', sourceRule: 'R5' });
  } else if (primary.scenario === 'R6_AOV_GOOD') {
    tasks.push({ order: 1, action: '复盘 1 个高客单成交案例，写出「客户需求、使用话术、连带商品、成交结果」四项，并在门店分享', completionDefinition: '四项齐全并完成分享', sourceRule: 'R6' });
  } else {
    tasks.push({ order: 1, action: `完成 ${Q.feedback} 位成交客户的售后跟进`, completionDefinition: '记录使用反馈与下次跟进时间', sourceRule: '保持' });
    tasks.push({ order: 2, action: '复盘 1 个成功成交案例', completionDefinition: '写出关键动作一条', sourceRule: '保持' });
  }
  // 高风险客户存在但主场景不是 R3 时，附加提醒任务（不超过 3 个）
  if (followupUrgent > 0 && primary.scenario !== 'R3_CUSTOMER_MAINTENANCE_VISIT_LOW' && tasks.length < DAP_CONFIG.maxTasksPerDay) {
    tasks.push({ order: tasks.length + 1, action: `另有 ${followupUrgent} 位高风险客户，至少完成 ${Math.min(DAP_CONFIG.minFollowupsPerDay, followupUrgent)} 位回访`, targetRefs: refs.slice(0, DAP_CONFIG.minFollowupsPerDay),
      completionDefinition: '填写未购买原因、当前需求、下次跟进时间', sourceRule: 'R3' });
  }

  return {
    date, timezone: 'Asia/Shanghai', dataVersion: d.version || '',
    primaryScenario: primary.scenario, priority: primary.priority, confidence: primary.confidence,
    headline: primary.headline, opportunity: primary.opportunity, evidence: primary.evidence,
    tasks: tasks.slice(0, DAP_CONFIG.maxTasksPerDay),
    dataWarnings: warnings,
    disabledScenarios: [
      { scenario: 'R8_REFERRAL_RATE_LOW', reason: '当前没有裂变率和老带新成交归因数据，异常诊断禁用（老带新仅作为固定运营动作出现）' },
      { scenario: '复购率趋势', reason: '仅有本月复购率，只能判断「偏低」，不能判断「下降」' },
      { scenario: '新客增速放缓', reason: '缺少第三个月数据，只能判断「增长不足」' },
    ],
  };
}

function renderAction(d) {
  const plan = buildDailyActionPlan(d);
  const insights = d.customerInsights || [];
  const suggestions = (d.suggestion || '').split('\n').filter(Boolean);
  const tasks = d.weeklyTasks || [];
  const pillClass = plan.priority.toLowerCase();
  const evHtml = plan.evidence.map(e => `<div class="dap-evidence"><b>${e.metric}：${e.current}</b> — ${e.detail}</div>`).join('');
  const taskHtml = plan.tasks.map(t => `
    <div class="dap-task">
      <div class="dap-task-num">${t.order}</div>
      <div>
        <div class="dap-task-action">${t.action}</div>
        <div class="dap-task-def">✅ 完成标准：${t.completionDefinition}</div>
        ${t.targetRefs && t.targetRefs.length ? `<div class="dap-task-refs">今日对象：${t.targetRefs.map(r => `<span>${r}</span>`).join('')}</div>` : ''}
      </div>
    </div>`).join('');
  return `<div class="card">
    <div class="section-title"><span class="icon">🎯</span> 今日行动建议</div>
    <div class="dap-head"><span class="dap-pill ${pillClass}">${plan.priority}</span><span class="dap-headline">${plan.headline}</span></div>
    <div class="dap-block"><div class="dap-block-title">📊 为什么（数据证据）</div>${evHtml}</div>
    <div class="dap-block"><div class="dap-block-title">💡 你的机会</div><div class="dap-opportunity">${plan.opportunity}</div></div>
    <div class="dap-block"><div class="dap-block-title">✍️ 今天完成（最多 ${DAP_CONFIG.maxTasksPerDay} 项）</div>${taskHtml}</div>
    ${plan.dataWarnings.length ? `<div class="dap-warn">⚠️ ${plan.dataWarnings.join('；')}</div>` : ''}
    <div class="dap-note">业务日期 ${plan.date} · 数据版本 ${plan.dataVersion || '—'} · 同日同数据建议保持一致，次日自动轮换 · 未启用：裂变率异常/复购趋势/新客增速（数据不足）</div>
  </div>

  <div class="card">
    <div class="section-title"><span class="icon">💡</span> 更多参考</div>

    <div class="section-title plain">🔍 客户洞察</div>
    ${insights.length ? insights.map(ins => `<div class="insight-item">${ins}</div>`).join('') : '<div class="insight-item">暂无洞察数据</div>'}

    <div class="section-title plain">💡 提升建议</div>
    <div class="suggestion">
      ${suggestions.length ? suggestions.map(s => `<div class="suggestion-item">${s}</div>`).join('') : '<div class="suggestion-item">暂无建议，继续保持！</div>'}
    </div>

    <div class="section-title plain">📅 本周服务清单</div>
    ${tasks.length ? tasks.map(t => `<div class="task-item"><span class="task-icon">${t.icon}</span><span class="task-text">${t.text}</span></div>`).join('') : '<div class="task-item"><span class="task-text">本周暂无需办事项</span></div>'}
  </div>`;
}

function renderView(view) {
  const d = _currentData;
  if (!d) return;
  const map = { overview:renderOverview, perf:renderPerf, followup:renderFollowup, action:renderAction, learning:renderLearningView };
  const fn = map[view] || renderOverview;
  const viewEl = $('view');
  if (viewEl) viewEl.innerHTML = fn(d);
  if (view === 'followup') {
    const first = document.querySelector('#fuStats .fu-stat.lost');
    if (first) first.classList.add('active');
  }
}

/* ===== Learning render (assets inlined) ===== */
function renderLearning(lr) {
  if (!lr || !lr.items || !lr.items.length) return '<div class="lr-empty">主推产品资料正在更新中</div>';
  const cards = lr.items.map(it => `
    <div class="lr-card">
      <div class="lr-name">${it.name}</div>
      ${it.video ? `<video class="lr-video" src="${it.video}" controls preload="none" poster="${it.poster || ''}"></video>` : ''}
      ${it.onepager ? `<img class="lr-img" src="${it.onepager}" alt="${it.name}一页纸" loading="lazy">` : ''}
      <div class="lr-links">
        ${it.onepager ? `<a class="lr-link" href="${it.onepager}" target="_blank" rel="noopener">📄 一页纸</a>` : ''}
        ${it.test ? `<a class="lr-link" href="${it.test}" download>📝 测试题</a>` : ''}
        ${it.video ? `<a class="lr-link" href="${it.video}" download>🎬 视频</a>` : ''}
      </div>
    </div>`).join('');
  return `<div class="lr-intro">${lr.intro||''}</div><div class="lr-grid">${cards}</div><div class="lr-tip">${lr.tip||''}</div>`;
}

function showError(msg) {
  $('app').innerHTML = `<div class="state-msg"><h2>😔 暂无数据</h2><p>${msg||'未找到该店员的数据'}</p></div>`;
}

function renderFollowupList(list, level) {
  const filtered = (list || []).filter(c => c.level === level);
  if (!filtered.length) {
    const emptyMsg = { lost:'暂无已流失客户', critical:'暂无高危客户', high:'暂无紧急回访客户', medium:'暂无本周回访客户' };
    return '<div style="text-align:center;padding:24px 0;color:#94a3b8;font-size:13px;">' + (emptyMsg[level]||'暂无数据') + '</div>';
  }
  return `
    <div class="followup-list">
      <div class="fu-header">
        <div style="flex:1.3">客户手机</div>
        <div style="flex:1">上次购买</div>
        <div style="flex:0.5;text-align:center;">天数</div>
        <div style="flex:1.5">建议回访日期</div>
      </div>
      ${filtered.map(c => `
      <div class="fu-row ${c.level}">
        <div style="flex:1.3;font-weight:600;">${c.phone||'—'}</div>
        <div style="flex:1;">${c.lastBuy||'—'}</div>
        <div style="flex:0.5;text-align:center;color:var(--text2);">${c.daysAgo!=null?c.daysAgo+'天':'—'}</div>
        <div style="flex:1.5;font-size:11px;color:#64748b;">${c.predicted||'—'}</div>
      </div>`).join('')}
    </div>`;
}

function switchFollowupTab(el) {
  document.querySelectorAll('#fuStats .fu-stat').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  const level = el.dataset.level;
  const list = (_currentData && _currentData.followUp && _currentData.followUp.list) || [];
  const fc = $('fuContent');
  if (fc) fc.innerHTML = renderFollowupList(list, level);
}

async function loadData(userId) {
  try {
    const resp = await fetch(`data/${encodeURIComponent(userId)}.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!resp.ok) throw new Error('数据加载失败');
    _currentData = await resp.json();
    buildShell(_currentData);
    const fromHash = (location.hash || '').replace('#', '');
    _currentView = VALID_VIEWS.includes(fromHash) ? fromHash : 'overview';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === _currentView));
    const vt = $('viewTitle'); if (vt) vt.textContent = VIEW_TITLES[_currentView] || '';
    renderView(_currentView);
    return true;
  } catch(e) { showError('未找到该店员数据，请联系管理员'); return false; }
}

function bustedReload() {
  const url = new URL(location.href);
  url.searchParams.set('_r', Date.now());
  location.replace(url);
}

async function checkVersion() {
  let v = null;
  try { v = (await (await fetch(VERSION_URL+'?t='+Date.now())).json()).version; } catch(_) {}
  if (v && !checkVersion._last) checkVersion._last = v;
  else if (v && v !== checkVersion._last) { $('toast').classList.add('show'); setTimeout(()=>bustedReload(),3000); }
}

(function cleanReloadParam() {
  const url = new URL(location.href);
  if (url.searchParams.has('_r')) { url.searchParams.delete('_r'); history.replaceState(null, '', url); }
})();

(async function() {
  const rawId = getParam('id');
  if (!rawId) { showError('请在链接中添加 ?id=参数'); return; }
  const uid = decodeId(rawId);
  if (await loadData(uid)) { setInterval(checkVersion, POLL); }
})();
</script>
