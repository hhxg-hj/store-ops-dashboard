<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>门店运营赋能 · 每日LTV快报</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --primary: #7c3aed; --primary-light: #f3e8ff;
      --accent: #e91e8c; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --text: #1e293b; --text2: #64748b; --border: #e8ebf0; --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .state-msg { text-align:center; padding:120px 20px; color:var(--text2); font-size:15px; }

    /* ===== Layout ===== */
    .shell { display:flex; min-height:100vh; }
    .sidebar {
      width:236px; flex-shrink:0; background:#fff; border-right:1px solid var(--border);
      display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    }
    .brand { padding:18px 20px 14px; font-weight:800; font-size:16px; color:var(--primary); display:flex; align-items:center; gap:8px; }
    .side-user { padding:16px 20px 16px; border-bottom:1px solid var(--border); margin-bottom:10px; display:flex; align-items:center; gap:12px; }
    .su-avatar {
      width:48px; height:48px; border-radius:14px; flex-shrink:0;
      background:linear-gradient(135deg,var(--primary),var(--accent));
      color:#fff; font-size:21px; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 5px 14px rgba(124,58,237,.32);
    }
    .su-info { min-width:0; }
    .su-name { font-size:19px; font-weight:800; color:var(--text); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .su-store { font-size:12px; color:var(--text2); margin-top:4px; }
    .su-meta { font-size:11px; color:var(--text2); margin-top:3px; }
    .nav { flex:1; padding:6px 12px; overflow:auto; }
    .nav-item {
      padding:11px 14px; border-radius:10px; margin:3px 0; cursor:pointer; font-size:14px;
      color:var(--text2); display:flex; align-items:center; gap:11px; transition:all .15s; user-select:none;
    }
    .nav-item:hover { background:var(--primary-light); color:var(--primary); }
    .nav-item.active { background:var(--primary); color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(124,58,237,.25); }
    .side-foot { padding:14px 20px; font-size:11px; color:var(--text2); border-top:1px solid var(--border); }
    .main { flex:1; display:flex; flex-direction:column; min-width:0; }
    .topbar {
      height:58px; background:#fff; border-bottom:1px solid var(--border); display:flex;
      align-items:center; justify-content:space-between; padding:0 22px; position:sticky; top:0; z-index:10;
    }
    .tb-name { font-size:13px; font-weight:700; }
    .tb-title { font-size:12px; color:var(--text2); margin-top:1px; }
    .tb-right { font-size:12px; color:var(--success); display:flex; align-items:center; gap:6px; }
    .tb-avatar {
      width:38px; height:38px; border-radius:11px;
      background:linear-gradient(135deg,var(--primary),var(--accent));
      color:#fff; font-size:16px; font-weight:800;
      display:none; align-items:center; justify-content:center;
      box-shadow:0 3px 10px rgba(124,58,237,.28);
    }
    .live-dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:pulse 1.6s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }
    .view { padding:20px 22px 40px; overflow:auto; flex:1; }

    .card { background:var(--card); border-radius:var(--radius); padding:18px 20px; box-shadow:0 1px 8px rgba(15,23,42,.05); margin-bottom:16px; }
    .view > .card:last-child { margin-bottom:0; }
    .section-title { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
    .section-title .icon { font-size:18px; }
    .section-title.plain { margin:18px 2px 6px; }

    /* 业绩奖励 */
    .reward-hero { text-align:center; padding:6px 0 2px; }
    .reward-amount { font-size:40px; font-weight:800; color:var(--accent); letter-spacing:-1px; }
    .reward-label { font-size:13px; color:var(--text2); }
    .rank-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .rank-item { background:var(--primary-light); border-radius:10px; padding:12px; text-align:center; }
    .rank-item .rank-num { font-size:15px; font-weight:700; color:var(--primary); }
    .rank-item .rank-label { font-size:11px; color:var(--text2); margin-top:4px; }

    /* KPI */
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:14px; }
    .kpi { background:#fff; border-radius:var(--radius); padding:16px 18px; box-shadow:0 1px 8px rgba(15,23,42,.05); border-left:3px solid var(--primary); }
    .kpi.accent { border-left-color:var(--accent); }
    .kpi.green { border-left-color:var(--success); }
    .kpi.orange { border-left-color:var(--warning); }
    .kpi-val { font-size:25px; font-weight:800; color:var(--text); line-height:1.1; }
    .kpi-lbl { font-size:12px; color:var(--text2); margin-top:6px; }
    .kpi-sub { font-size:11px; margin-top:6px; }

    /* 销售业绩 */
    .perf-table { width:100%; font-size:13px; border-collapse:collapse; }
    .perf-table th { text-align:left; color:var(--text2); font-weight:500; padding:7px 4px; border-bottom:1px solid var(--border); font-size:11px; }
    .perf-table td { padding:8px 4px; border-bottom:1px solid #f4f4f6; }
    .perf-table .section-row td { font-weight:700; padding-top:14px; font-size:14px; color:var(--primary); border-bottom:2px solid var(--primary-light); }
    .mom { font-size:12px; }
    .mom-up { color:var(--danger); } .mom-down { color:var(--success); } .mom-none { color:var(--text2); }

    /* 用户服务 */
    .service-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
    .service-item { text-align:center; padding:14px 8px; background:#fafbff; border-radius:10px; }
    .service-item .sv { font-size:20px; font-weight:700; }
    .service-item .sl { font-size:11px; color:var(--text2); margin-top:4px; }
    .service-item .sm { font-size:10px; margin-top:3px; }

    /* 建议 / 洞察 */
    .suggestion { font-size:13px; line-height:1.8; white-space:pre-line; color:#334155; }
    .suggestion-item { padding:9px 13px; margin:5px 0; background:#fffbeb; border-left:3px solid var(--warning); border-radius:6px; }
    .insight-item { padding:11px 15px; margin:7px 0; background:#f8f6ff; border-left:3px solid var(--primary); border-radius:6px; font-size:13px; line-height:1.7; }

    /* 学习资源 */
    .lr-intro { font-size:13px; line-height:1.7; color:#334155; margin-bottom:12px; }
    .lr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
    .lr-card { border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#fff; }
    .lr-name { font-weight:600; font-size:13px; padding:9px 12px; background:#f8fafc; border-bottom:1px solid var(--border); }
    .lr-img { width:100%; display:block; }
    .lr-video { width:100%; display:block; background:#000; margin-top:8px; }
    .lr-links { display:flex; gap:8px; padding:9px 12px; flex-wrap:wrap; }
    .lr-link { font-size:12px; color:var(--primary); text-decoration:none; background:#eff6ff; padding:5px 11px; border-radius:7px; }
    .lr-link:hover { background:#dbeafe; }
    .lr-tip { font-size:12px; color:#64748b; margin-top:10px; line-height:1.6; }
    .lr-empty { font-size:13px; color:#94a3b8; padding:12px 0; }

    .refresh-info { text-align:center; font-size:11px; color:var(--text2); padding:8px 0 4px; }
    .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:20px; font-size:13px; cursor:pointer; z-index:999; display:none; }
    .toast.show { display:block; animation:slide .3s ease; }
    @keyframes slide { from { transform:translateX(-50%) translateY(-40px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }

    /* Follow-up */
    .followup-stats { display:flex; gap:8px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
    .fu-stat { text-align:center; padding:10px 16px; border-radius:9px; min-width:58px; cursor:pointer; transition:transform .15s, opacity .15s; opacity:.55; }
    .fu-stat:hover { opacity:.85; }
    .fu-stat.active { opacity:1; transform:scale(1.06); box-shadow:0 0 0 2px currentColor; }
    .fu-stat .fu-num { font-size:22px; font-weight:700; }
    .fu-stat .fu-lbl { font-size:10px; margin-top:2px; }
    .fu-stat.lost { background:#fef2f2; color:#dc2626; }
    .fu-stat.critical { background:#fff7ed; color:#ea580c; }
    .fu-stat.high { background:#fefce8; color:#ca8a04; }
    .fu-stat.medium { background:#f0fdf4; color:#16a34a; }
    .followup-list { margin-top:8px; }
    .fu-header, .fu-row { display:flex; align-items:center; padding:7px 8px; font-size:12px; }
    .fu-header { color:var(--text2); font-weight:600; border-bottom:2px solid var(--border); margin-bottom:4px; }
    .fu-row { border-bottom:1px solid #f6f6f8; border-radius:4px; }
    .fu-row.lost { background:#fef2f2; }
    .fu-row.critical { background:#fff7ed; }
    .fu-row.high { background:#fefce8; }
    .fu-row.medium { background:#f0fdf4; }

    /* 本周服务 */
    .task-item { display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid #f3f3f5; }
    .task-item:last-child { border-bottom:none; }
    .task-icon { font-size:18px; flex-shrink:0; width:28px; text-align:center; }
    .task-text { font-size:13px; line-height:1.6; }

    /* ===== Responsive (mobile) ===== */
    @media (max-width: 760px) {
      .shell { flex-direction:column; }
      .sidebar { width:100%; height:auto; position:static; flex-direction:row; align-items:center; border-right:none; border-bottom:1px solid var(--border); overflow-x:auto; padding:6px; }
      .brand, .side-user, .side-foot { display:none; }
      .nav { flex-direction:row; padding:0; overflow-x:auto; }
      .nav-item { white-space:nowrap; margin:0 4px; padding:9px 14px; font-size:13px; }
      .nav-item span { display:none; }
      .view { padding:14px 14px 36px; }
      .topbar { height:64px; padding:0 16px; }
      .tb-avatar { display:flex; }
      .tb-name { font-size:18px; font-weight:800; }
      .tb-title { font-size:11px; margin-top:2px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="state-msg">📊 加载中...</div>
  </div>
  <div class="toast" id="toast" onclick="bustedReload()">🔄 数据已更新，点击刷新 →</div>

<script>
const VERSION_URL = 'data/version.json';
const POLL = 60_000;
let _currentData = null;
let _currentView = 'overview';

function $(id) { return document.getElementById(id); }
function getParam(n) { return new URL(location.href).searchParams.get(n); }

// Base64 UTF-8 decode for URL id parameter
function decodeId(raw) {
  if (!raw) return null;
  try {
    const binary = atob(raw);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if (decoded && decoded.length > 0 && decoded.length < 50) return decoded;
  } catch(_) {}
  return raw;
}
function fmtPct(v, raw) { if (v == null || isNaN(v)) return '—'; const p = raw ? v * 100 : v; return (p >= 0 ? '↑' : '↓') + Math.abs(p).toFixed(1) + '%'; }
function fmtMoney(v) { if (v == null || isNaN(v)) return '¥0'; return '¥' + Number(v).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtNum(v) { if (v == null || isNaN(v)) return '0'; return Number(v).toLocaleString('zh-CN'); }
function momClass(v) { if (v == null || isNaN(v)) return 'mom-none'; return v >= 0 ? 'mom-up' : 'mom-down'; }
function momLabel(v) { if (v == null || isNaN(v)) return '—'; return fmtPct(v, true); }

const VIEW_TITLES = { overview:'运营概览', perf:'销售业绩', followup:'客户回访', action:'行动建议', learning:'学习资源' };
const VALID_VIEWS = ['overview','perf','followup','action','learning'];

/* ===== Shell ===== */
function buildShell(d) {
  $('app').innerHTML = `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">🚀 门店运营赋能</div>
      <div class="side-user">
        <div class="su-avatar">${(d.name || '店')[0]}</div>
        <div class="su-info">
          <div class="su-name">${d.name || '店员'}</div>
          <div class="su-store">🏪 ${d.store || '未知门店'}</div>
          <div class="su-meta">${d.region || ''} · ${d.zaidian ? '在店' : '离店'}</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-item" data-view="overview" onclick="navTo('overview')"><span>🏠</span>运营概览</div>
        <div class="nav-item" data-view="perf" onclick="navTo('perf')"><span>📈</span>销售业绩</div>
        <div class="nav-item" data-view="followup" onclick="navTo('followup')"><span>📞</span>客户回访</div>
        <div class="nav-item" data-view="action" onclick="navTo('action')"><span>💡</span>行动建议</div>
        <div class="nav-item" data-view="learning" onclick="navTo('learning')"><span>📚</span>学习资源</div>
      </nav>
      <div class="side-foot">🕐 每60秒自动更新 · v${d.version || '-'}</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:11px;">
          <div class="tb-avatar">${(d.name || '店')[0]}</div>
          <div>
            <div class="tb-name">${d.name || '店员'}${d.isManager ? ' · 👔' : ''}</div>
            <div class="tb-title" id="viewTitle">运营概览</div>
          </div>
        </div>
        <div class="tb-right"><span class="live-dot"></span> 实时</div>
      </div>
      <div class="view" id="view"></div>
    </main>
  </div>`;
}

function navTo(view) {
  if (!VALID_VIEWS.includes(view)) view = 'overview';
  _currentView = view;
  const url = new URL(location.href); url.hash = view; history.replaceState(null, '', url);
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  const vt = $('viewTitle'); if (vt) vt.textContent = VIEW_TITLES[view] || '';
  renderView(view);
  const main = document.querySelector('.main'); if (main) main.scrollTop = 0;
}

/* ===== Views ===== */
function renderOverview(d) {
  const sa = d.storeAgg || {};
  const storeRate = sa.achievementRate ? (sa.achievementRate*100).toFixed(1) + '%' : '—';
  const persRate = d.achievementRate ? (d.achievementRate*100).toFixed(1) + '%' : '—';
  const gapColor = v => (v>=0 ? 'var(--success)' : 'var(--warning)');
  return `
  <div class="card">
    <div class="section-title"><span class="icon">💰</span> 业绩奖励</div>
    <div class="reward-hero">
      <div class="reward-amount">${fmtMoney(d.commission)}</div>
      <div class="reward-label">本月业绩奖励</div>
    </div>
    <div class="rank-grid">
      <div class="rank-item">
        <div class="rank-num">🥇 第${d.storeRank}名 / ${d.storeTotal}人</div>
        <div class="rank-label">门店排名 · 榜首 ${d.storeTopName||'-'}</div>
        <div style="font-size:12px;margin-top:3px;color:${gapColor((d.commission||0)-(d.storeTopComm||0))}">差距 ¥${fmtNum(((d.storeTopComm||0)-(d.commission||0)).toFixed(0))}</div>
      </div>
      <div class="rank-item">
        <div class="rank-num">🏆 第${d.regionRank}名 / ${d.regionTotal}人</div>
        <div class="rank-label">区域排名 · 榜首 ${d.regionTopName||'-'}</div>
        <div style="font-size:12px;margin-top:3px;color:${gapColor((d.commission||0)-(d.regionTopComm||0))}">差距 ¥${fmtNum(((d.regionTopComm||0)-(d.commission||0)).toFixed(0))}</div>
      </div>
    </div>
  </div>

  <div class="section-title plain">📊 核心指标</div>
  <div class="kpi-grid">
    <div class="kpi accent"><div class="kpi-val">${persRate}</div><div class="kpi-lbl">个人目标达成率</div><div class="kpi-sub" style="color:var(--text2)">门店均值 ${storeRate}</div></div>
    <div class="kpi"><div class="kpi-val">${fmtNum(d.milkCans)}</div><div class="kpi-lbl">奶粉销量 (罐)</div><div class="kpi-sub mom ${momClass(d.momMilkCans)}">环比 ${momLabel(d.momMilkCans)}</div></div>
    <div class="kpi"><div class="kpi-val">${fmtNum(d.pushCans)}</div><div class="kpi-lbl">主推销量 (罐)</div><div class="kpi-sub mom ${momClass(d.momPushCans)}">环比 ${momLabel(d.momPushCans)}</div></div>
    <div class="kpi"><div class="kpi-val">${fmtNum(d.milkClients)}</div><div class="kpi-lbl">奶粉用户</div><div class="kpi-sub mom ${momClass(d.momMilkClients)}">环比 ${momLabel(d.momMilkClients)}</div></div>
    <div class="kpi"><div class="kpi-val">${fmtNum(d.pushClients)}</div><div class="kpi-lbl">主推用户</div><div class="kpi-sub mom ${momClass(d.momPushClients)}">环比 ${momLabel(d.momPushClients)}</div></div>
    <div class="kpi orange"><div class="kpi-val">${fmtNum(d.depositCount)}</div><div class="kpi-lbl">保证金用户</div></div>
    <div class="kpi"><div class="kpi-val">${d.milkAvg ? d.milkAvg.toFixed(1) : '—'}</div><div class="kpi-lbl">奶粉客单量 (罐/人)</div><div class="kpi-sub mom ${momClass(d.momMilkAvg)}">环比 ${momLabel(d.momMilkAvg)}</div></div>
    <div class="kpi green"><div class="kpi-val">${fmtNum(d.totalClients)}</div><div class="kpi-lbl">成交用户</div><div class="kpi-sub mom ${momClass(d.momClients)}">环比 ${momLabel(d.momClients)}</div></div>
    <div class="kpi"><div class="kpi-val">${fmtNum(d.visitDone)}<span style="font-size:14px;color:var(--text2)"> / ${fmtNum(d.visitShould)}</span></div><div class="kpi-lbl">回访 已回/应回</div><div class="kpi-sub" style="color:var(--warning)">待回 ${fmtNum(d.visitPending)}</div></div>
  </div>`;
}

function renderPerf(d) {
  const sa = d.storeAgg || {};
  const storeMomMilk = sa.momMilkCans != null ? fmtPct(sa.momMilkCans, true) : '—';
  const storeMomPush = sa.momPushCans != null ? fmtPct(sa.momPushCans, true) : '—';
  const storeRate = sa.achievementRate ? (sa.achievementRate*100).toFixed(1) + '%' : '—';
  return `<div class="card">
    <div class="section-title"><span class="icon">📈</span> 销售业绩</div>
    <table class="perf-table">
      <thead><tr><th>指标</th><th>本月</th><th>环比</th></tr></thead>
      <tbody>
        <tr class="section-row"><td colspan="3">一、门店业绩</td></tr>
        <tr><td>💰 本月销售目标</td><td>${fmtMoney(sa.target)}</td><td></td></tr>
        <tr><td>💰 本月累计销售</td><td>${fmtMoney(sa.achieved)}</td><td></td></tr>
        <tr><td>📈 目标达成率</td><td>${storeRate}</td><td>—</td></tr>
        <tr><td>🥛 本月奶粉销量</td><td>${fmtNum(sa.milkCans)}罐</td><td class="${momClass(sa.momMilkCans)} mom">${storeMomMilk}</td></tr>
        <tr><td>🎯 本月主推销量</td><td>${fmtNum(sa.pushCans)}罐</td><td class="${momClass(sa.momPushCans)} mom">${storeMomPush}</td></tr>
        <tr class="section-row"><td colspan="3">二、个人业绩</td></tr>
        <tr><td>💰 本月销售目标</td><td>${fmtMoney(d.target)}</td><td></td></tr>
        <tr><td>💰 本月累计销售</td><td>${fmtMoney(d.achieved)}</td><td></td></tr>
        <tr><td>📈 目标达成率</td><td>${d.achievementRate ? (d.achievementRate*100).toFixed(1)+'%' : '—'}</td><td>—</td></tr>
        <tr><td>🥛 本月奶粉销量</td><td>${fmtNum(d.milkCans)}罐</td><td class="${momClass(d.momMilkCans)} mom">${momLabel(d.momMilkCans)}</td></tr>
        <tr><td>🎯 本月主推销量</td><td>${fmtNum(d.pushCans)}罐</td><td class="${momClass(d.momPushCans)} mom">${momLabel(d.momPushCans)}</td></tr>
      </tbody>
    </table>
  </div>`;
}

function renderFollowup(d) {
  return `<div class="card">
    <div class="section-title"><span class="icon">📞</span> 客户回访清单</div>
    <div class="followup-stats" id="fuStats">
      <div class="fu-stat lost" data-level="lost" onclick="switchFollowupTab(this)"><div class="fu-num">${d.followUp?.lost||0}</div><div class="fu-lbl">已流失</div></div>
      <div class="fu-stat critical" data-level="critical" onclick="switchFollowupTab(this)"><div class="fu-num">${d.followUp?.critical||0}</div><div class="fu-lbl">高危</div></div>
      <div class="fu-stat high" data-level="high" onclick="switchFollowupTab(this)"><div class="fu-num">${d.followUp?.high||0}</div><div class="fu-lbl">紧急</div></div>
      <div class="fu-stat medium" data-level="medium" onclick="switchFollowupTab(this)"><div class="fu-num">${d.followUp?.medium||0}</div><div class="fu-lbl">本周</div></div>
    </div>
    <div id="fuContent">${renderFollowupList(d.followUp?.list||[], 'lost')}</div>
  </div>`;
}

function renderLearningView(d) {
  return `<div class="card">
    <div class="section-title"><span class="icon">📚</span> 学习资源</div>
    ${renderLearning(d.learningResources)}
  </div>`;
}

function renderAction(d) {
  const insights = d.customerInsights || [];
  const suggestions = (d.suggestion || '').split('\n').filter(Boolean);
  const tasks = d.weeklyTasks || [];
  return `<div class="card">
    <div class="section-title"><span class="icon">💡</span> 行动建议</div>

    <div class="section-title plain">🔍 客户洞察</div>
    ${insights.length ? insights.map(ins => `<div class="insight-item">${ins}</div>`).join('') : '<div class="insight-item">暂无洞察数据</div>'}

    <div class="section-title plain">💡 提升建议</div>
    <div class="suggestion">
      ${suggestions.length ? suggestions.map(s => `<div class="suggestion-item">${s}</div>`).join('') : '<div class="suggestion-item">暂无建议，继续保持！</div>'}
    </div>

    <div class="section-title plain">📅 本周服务清单</div>
    ${tasks.length ? tasks.map(t => `<div class="task-item"><span class="task-icon">${t.icon}</span><span class="task-text">${t.text}</span></div>`).join('') : '<div class="task-item"><span class="task-text">本周暂无需办事项</span></div>'}
  </div>`;
}

function renderView(view) {
  const d = _currentData;
  if (!d) return;
  const map = { overview:renderOverview, perf:renderPerf, followup:renderFollowup, action:renderAction, learning:renderLearningView };
  const fn = map[view] || renderOverview;
  const viewEl = $('view');
  if (viewEl) viewEl.innerHTML = fn(d);
  if (view === 'followup') {
    const first = document.querySelector('#fuStats .fu-stat.lost');
    if (first) first.classList.add('active');
  }
}

/* ===== Learning render (assets inlined) ===== */
function renderLearning(lr) {
  if (!lr || !lr.items || !lr.items.length) return '<div class="lr-empty">主推产品资料正在更新中</div>';
  const cards = lr.items.map(it => `
    <div class="lr-card">
      <div class="lr-name">${it.name}</div>
      ${it.video ? `<video class="lr-video" src="${it.video}" controls preload="none" poster="${it.poster || ''}"></video>` : ''}
      ${it.onepager ? `<img class="lr-img" src="${it.onepager}" alt="${it.name}一页纸" loading="lazy">` : ''}
      <div class="lr-links">
        ${it.onepager ? `<a class="lr-link" href="${it.onepager}" target="_blank" rel="noopener">📄 一页纸</a>` : ''}
        ${it.test ? `<a class="lr-link" href="${it.test}" download>📝 测试题</a>` : ''}
        ${it.video ? `<a class="lr-link" href="${it.video}" download>🎬 视频</a>` : ''}
      </div>
    </div>`).join('');
  return `<div class="lr-intro">${lr.intro||''}</div><div class="lr-grid">${cards}</div><div class="lr-tip">${lr.tip||''}</div>`;
}

function showError(msg) {
  $('app').innerHTML = `<div class="state-msg"><h2>😔 暂无数据</h2><p>${msg||'未找到该店员的数据'}</p></div>`;
}

function renderFollowupList(list, level) {
  const filtered = (list || []).filter(c => c.level === level);
  if (!filtered.length) {
    const emptyMsg = { lost:'暂无已流失客户', critical:'暂无高危客户', high:'暂无紧急回访客户', medium:'暂无本周回访客户' };
    return '<div style="text-align:center;padding:24px 0;color:#94a3b8;font-size:13px;">' + (emptyMsg[level]||'暂无数据') + '</div>';
  }
  return `
    <div class="followup-list">
      <div class="fu-header">
        <div style="flex:1.3">客户手机</div>
        <div style="flex:1">上次购买</div>
        <div style="flex:0.5;text-align:center;">天数</div>
        <div style="flex:1.5">建议回访日期</div>
      </div>
      ${filtered.map(c => `
      <div class="fu-row ${c.level}">
        <div style="flex:1.3;font-weight:600;">${c.phone||'—'}</div>
        <div style="flex:1;">${c.lastBuy||'—'}</div>
        <div style="flex:0.5;text-align:center;color:var(--text2);">${c.daysAgo!=null?c.daysAgo+'天':'—'}</div>
        <div style="flex:1.5;font-size:11px;color:#64748b;">${c.predicted||'—'}</div>
      </div>`).join('')}
    </div>`;
}

function switchFollowupTab(el) {
  document.querySelectorAll('#fuStats .fu-stat').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  const level = el.dataset.level;
  const list = (_currentData && _currentData.followUp && _currentData.followUp.list) || [];
  const fc = $('fuContent');
  if (fc) fc.innerHTML = renderFollowupList(list, level);
}

async function loadData(userId) {
  try {
    const resp = await fetch(`data/${encodeURIComponent(userId)}.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!resp.ok) throw new Error('数据加载失败');
    _currentData = await resp.json();
    buildShell(_currentData);
    const fromHash = (location.hash || '').replace('#', '');
    _currentView = VALID_VIEWS.includes(fromHash) ? fromHash : 'overview';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === _currentView));
    const vt = $('viewTitle'); if (vt) vt.textContent = VIEW_TITLES[_currentView] || '';
    renderView(_currentView);
    return true;
  } catch(e) { showError('未找到该店员数据，请联系管理员'); return false; }
}

function bustedReload() {
  const url = new URL(location.href);
  url.searchParams.set('_r', Date.now());
  location.replace(url);
}

async function checkVersion() {
  let v = null;
  try { v = (await (await fetch(VERSION_URL+'?t='+Date.now())).json()).version; } catch(_) {}
  if (v && !checkVersion._last) checkVersion._last = v;
  else if (v && v !== checkVersion._last) { $('toast').classList.add('show'); setTimeout(()=>bustedReload(),3000); }
}

(function cleanReloadParam() {
  const url = new URL(location.href);
  if (url.searchParams.has('_r')) { url.searchParams.delete('_r'); history.replaceState(null, '', url); }
})();

(async function() {
  const rawId = getParam('id');
  if (!rawId) { showError('请在链接中添加 ?id=参数'); return; }
  const uid = decodeId(rawId);
  if (await loadData(uid)) { setInterval(checkVersion, POLL); }
})();
</script>
</body>
</html>
