<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>门店运营赋能 · 每日LTV快报</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f5f0f8; --card: #fff; --primary: #7c3aed; --primary-light: #f3e8ff;
      --accent: #e91e8c; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --text: #1e293b; --text2: #64748b; --border: #e2e8f0; --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px;
    }
    .container { max-width: 720px; margin: 0 auto; }

    /* Header */
    .header {
      background: linear-gradient(135deg, #7c3aed, #e91e8c); color: #fff;
      border-radius: var(--radius); padding: 20px 24px; margin-bottom: 14px; position: relative; overflow: hidden;
    }
    .header::after { content:''; position:absolute; top:-30%; right:-15%; width:200px; height:200px; background:rgba(255,255,255,.05); border-radius:50%; }
    .header-row { display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1; }
    .header-name { font-size:26px; font-weight:700; }
    .header-store { font-size:13px; opacity:.85; margin-top:4px; }
    .header-badge { background:rgba(255,255,255,.18); padding:4px 12px; border-radius:14px; font-size:12px; }
    .header-meta { font-size:12px; opacity:.7; margin-top:8px; position:relative; z-index:1; }

    .section { margin-bottom: 14px; }
    .card { background:var(--card); border-radius:var(--radius); padding:18px 20px; box-shadow:0 1px 6px rgba(0,0,0,.05); }
    .section-title { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
    .section-title .icon { font-size:18px; }

    /* 业绩奖励 */
    .reward-hero { text-align:center; padding:8px 0 4px; }
    .reward-amount { font-size:38px; font-weight:800; color:var(--accent); }
    .reward-label { font-size:13px; color:var(--text2); }
    .rank-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    .rank-item { background:var(--primary-light); border-radius:8px; padding:10px; text-align:center; }
    .rank-item .rank-num { font-size:22px; font-weight:700; color:var(--primary); }
    .rank-item .rank-label { font-size:11px; color:var(--text2); margin-top:3px; }

    /* 销售业绩 */
    .perf-table { width:100%; font-size:13px; border-collapse:collapse; }
    .perf-table th { text-align:left; color:var(--text2); font-weight:500; padding:7px 4px; border-bottom:1px solid var(--border); font-size:11px; }
    .perf-table td { padding:7px 4px; border-bottom:1px solid #f8f8f8; }
    .perf-table .section-row td { font-weight:700; padding-top:12px; font-size:14px; color:var(--primary); border-bottom:2px solid var(--primary-light); }
    .mom { font-size:12px; }
    .mom-up { color:var(--danger); } .mom-down { color:var(--success); } .mom-none { color:var(--text2); }

    /* 用户服务 */
    .service-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .service-item { text-align:center; padding:12px 8px; background:#fafafa; border-radius:8px; }
    .service-item .sv { font-size:18px; font-weight:700; }
    .service-item .sl { font-size:11px; color:var(--text2); margin-top:3px; }
    .service-item .sm { font-size:10px; margin-top:2px; }

    /* 建议 */
    .suggestion { font-size:13px; line-height:1.8; white-space:pre-line; color:#334155; }
    .suggestion-item { padding:8px 12px; margin:4px 0; background:#fffbeb; border-left:3px solid var(--warning); border-radius:4px; }

    /* 学习资源 */
    .learning { font-size:13px; line-height:1.8; white-space:pre-line; color:#334155; }

    .refresh-info { text-align:center; font-size:11px; color:var(--text2); padding:16px 0 8px; }
    .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:20px; font-size:13px; cursor:pointer; z-index:999; display:none; }
    .toast.show { display:block; animation:slide .3s ease; }
    @keyframes slide { from { transform:translateX(-50%) translateY(-40px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }
    .state-msg { text-align:center; padding:80px 20px; color:var(--text2); }
  
    /* Follow-up */
    .followup-stats { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
    .fu-stat { text-align:center; padding:10px 14px; border-radius:8px; min-width:55px; }
    .fu-stat .fu-num { font-size:22px; font-weight:700; }
    .fu-stat .fu-lbl { font-size:10px; margin-top:2px; }
    .fu-stat.lost { background:#fef2f2; color:#dc2626; }
    .fu-stat.critical { background:#fff7ed; color:#ea580c; }
    .fu-stat.high { background:#fefce8; color:#ca8a04; }
    .fu-stat.medium { background:#f0fdf4; color:#16a34a; }
    .fu-stat.low { background:#f0f9ff; color:#0284c7; }
    .followup-list { margin-top:8px; }
    .fu-header, .fu-row { display:flex; align-items:center; padding:6px 8px; font-size:12px; }
    .fu-header { color:var(--text2); font-weight:600; border-bottom:2px solid var(--border); margin-bottom:4px; }
    .fu-row { border-bottom:1px solid #f8f8f8; border-radius:4px; }
    .fu-row.lost { background:#fef2f2; }
    .fu-row.critical { background:#fff7ed; }
    .fu-row.high { background:#fefce8; }
    .fu-badge { padding:2px 6px; border-radius:6px; font-size:10px; font-weight:600; }
    .fu-badge.fu-lost { background:#fee2e2; color:#dc2626; }
    .fu-badge.fu-critical { background:#ffedd5; color:#ea580c; }
    .fu-badge.fu-high { background:#fef9c3; color:#ca8a04; }
    .fu-badge.fu-medium { background:#dcfce7; color:#16a34a; }
    .fu-badge.fu-low { background:#e0f2fe; color:#0284c7; }
</style>
</head>
<body>
  <div class="container" id="app">
    <div class="state-msg"><h2>📊 加载中...</h2><p>正在获取最新数据</p></div>
  </div>
  <div class="toast" id="toast" onclick="location.reload()">🔄 数据已更新，点击刷新 →</div>

<script>
const VERSION_URL = 'data/version.json';
const POLL = 60_000;

function $(id) { return document.getElementById(id); }
function getParam(n) { return new URL(location.href).searchParams.get(n); }
function fmtPct(v, raw) { if (v == null || isNaN(v)) return '—'; const p = raw ? v * 100 : v; return (p >= 0 ? '↑' : '↓') + Math.abs(p).toFixed(1) + '%'; }
function fmtMoney(v) { if (v == null || isNaN(v)) return '¥0'; return '¥' + Number(v).toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(v) { if (v == null || isNaN(v)) return '0'; return Number(v).toLocaleString('zh-CN'); }
function momClass(v) { if (v == null || isNaN(v)) return 'mom-none'; return v >= 0 ? 'mom-up' : 'mom-down'; }
function momLabel(v) { if (v == null || isNaN(v)) return '—'; return fmtPct(v, true); }

function render(d) {
  const sa = d.storeAgg || {};
  const storeMomMilk = sa.momMilkCans != null ? fmtPct(sa.momMilkCans, true) : '—';
  const storeMomPush = sa.momPushCans != null ? fmtPct(sa.momPushCans, true) : '—';
  const storeRate = sa.achievementRate ? (sa.achievementRate*100).toFixed(1) + '%' : '—';
  
  // Suggestions
  const suggestions = (d.suggestion || '').split('\n').filter(Boolean);

  const html = `
<!-- Header -->
<div class="header">
  <div class="header-row">
    <div>
      <div class="header-name">👤 ${d.name || '店员'}</div>
      <div class="header-store">🏪 ${d.store || '未知门店'}</div>
    </div>
    <div class="header-badge">${d.region || ''} · ${d.zaidian ? '在店' : '离店'}</div>
  </div>
  <div class="header-meta">🕐 数据更新至 ${d.version || d.month || '-'}${d.isManager ? ' · 👔 见习店长' : ''}</div>
</div>

<!-- 业绩奖励 -->
<div class="section">
  <div class="card">
    <div class="section-title"><span class="icon">💰</span> 业绩奖励</div>
    <div class="reward-hero">
      <div class="reward-amount">${fmtMoney(d.commission)}</div>
      <div class="reward-label">本月业绩奖励</div>
    </div>
    <div class="rank-grid">
      <div class="rank-item">
        <div class="rank-num">🥇 第${d.storeRank}名/${d.storeTotal}人</div>
        <div class="rank-label">门店排名 · 榜首 ${d.storeTopName} ¥${fmtNum(d.storeTopComm?.toFixed(0))}</div>
        <div style="font-size:12px;margin-top:2px;color:${(d.commission||0)>=(d.storeTopComm||0)?'var(--success)':'var(--warning)'}">
          差距 ¥${fmtNum(((d.storeTopComm||0)-(d.commission||0)).toFixed(0))}
        </div>
      </div>
      <div class="rank-item">
        <div class="rank-num">🏆 第${d.regionRank}名/${d.regionTotal}人</div>
        <div class="rank-label">区域排名 · 榜首 ${d.regionTopName} ¥${fmtNum(d.regionTopComm?.toFixed(0))}</div>
        <div style="font-size:12px;margin-top:2px;color:${(d.commission||0)>=(d.regionTopComm||0)?'var(--success)':'var(--warning)'}">
          差距 ¥${fmtNum(((d.regionTopComm||0)-(d.commission||0)).toFixed(0))}
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 销售业绩 -->
<div class="section">
  <div class="card">
    <div class="section-title"><span class="icon">📈</span> 销售业绩</div>
    <table class="perf-table">
      <thead><tr><th>指标</th><th>本月</th><th>环比</th></tr></thead>
      <tbody>
        <tr class="section-row"><td colspan="3">一、门店业绩</td></tr>
        <tr><td>💰 本月销售目标</td><td>${fmtMoney(sa.target)}</td><td></td></tr>
        <tr><td>💰 本月累计销售</td><td>${fmtMoney(sa.achieved)}</td><td></td></tr>
        <tr><td>📈 目标达成率</td><td>${storeRate}</td><td>—</td></tr>
        <tr><td>🥛 本月奶粉销量</td><td>${fmtNum(sa.milkCans)}罐</td><td class="${momClass(sa.momMilkCans)} mom">${storeMomMilk}</td></tr>
        <tr><td>🎯 本月主推销量</td><td>${fmtNum(sa.pushCans)}罐</td><td class="${momClass(sa.momPushCans)} mom">${storeMomPush}</td></tr>

        <tr class="section-row"><td colspan="3">二、个人业绩</td></tr>
        <tr><td>💰 本月销售目标</td><td>${fmtMoney(d.target)}</td><td></td></tr>
        <tr><td>💰 本月累计销售</td><td>${fmtMoney(d.achieved)}</td><td></td></tr>
        <tr><td>📈 目标达成率</td><td>${d.achievementRate ? (d.achievementRate*100).toFixed(1)+'%' : '—'}</td><td>—</td></tr>
        <tr><td>🥛 本月奶粉销量</td><td>${fmtNum(d.milkCans)}罐</td><td class="${momClass(d.momMilkCans)} mom">${momLabel(d.momMilkCans)}</td></tr>
        <tr><td>🎯 本月主推销量</td><td>${fmtNum(d.pushCans)}罐</td><td class="${momClass(d.momPushCans)} mom">${momLabel(d.momPushCans)}</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 用户服务 -->
<div class="section">
  <div class="card">
    <div class="section-title"><span class="icon">👥</span> 用户服务</div>
    <div class="service-grid">
      <div class="service-item">
        <div class="sv">${fmtNum(d.totalClients)}</div>
        <div class="sl">本月成交用户</div>
        <div class="sm ${momClass(d.momClients)}">环比 ${momLabel(d.momClients)}</div>
      </div>
      <div class="service-item">
        <div class="sv">${fmtNum(d.milkClients)}</div>
        <div class="sl">本月奶粉用户</div>
        <div class="sm ${momClass(d.momMilkClients)}">环比 ${momLabel(d.momMilkClients)}</div>
      </div>
      <div class="service-item">
        <div class="sv">${fmtNum(d.pushClients)}</div>
        <div class="sl">本月主推用户</div>
        <div class="sm ${momClass(d.momPushClients)}">环比 ${momLabel(d.momPushClients)}</div>
      </div>
      <div class="service-item">
        <div class="sv">${fmtNum(d.depositCount)}</div>
        <div class="sl">本月保证金用户</div>
        <div class="sm">—</div>
      </div>
      <div class="service-item">
        <div class="sv">${d.milkAvg ? d.milkAvg.toFixed(1)+'罐/人' : '—'}</div>
        <div class="sl">奶粉客单量</div>
        <div class="sm ${momClass(d.momMilkAvg)}">环比 ${momLabel(d.momMilkAvg)}</div>
      </div>
      <div class="service-item">
        <div class="sv">${fmtNum(d.visitShould)} / ${fmtNum(d.visitDone)}</div>
        <div class="sl">回访 应回/已回</div>
        <div class="sm">待回访 ${fmtNum(d.visitPending)}</div>
      </div>
    </div>
  </div>
</div>

<!-- 提升建议 -->
<div class="section">
  <div class="card">
    <div class="section-title"><span class="icon">💡</span> 提升建议</div>
    <div class="suggestion">
      ${suggestions.length > 0 ? suggestions.map(s => `<div class="suggestion-item">${s}</div>`).join('') : '<div class="suggestion-item">暂无建议，继续保持！</div>'}
    </div>
  </div>
</div>

<!-- 学习资源 -->
<div class="section">
  <div class="card">
    <div class="section-title"><span class="icon">📚</span> 学习资源</div>
    <div class="learning">${(d.learningResources||'').replace(/\n/g,'<br>') || '主推产品资料正在更新中'}</div>
  </div>
</div>


<!-- 回访清单 -->
<div class="section">
  <div class="card">
    <div class="section-title"><span class="icon">📞</span> 客户回访清单</div>
    <div class="followup-stats">
      <div class="fu-stat lost"><div class="fu-num">${d.followUp?.lost||0}</div><div class="fu-lbl">已流失</div></div>
      <div class="fu-stat critical"><div class="fu-num">${d.followUp?.critical||0}</div><div class="fu-lbl">高危</div></div>
      <div class="fu-stat high"><div class="fu-num">${d.followUp?.high||0}</div><div class="fu-lbl">紧急</div></div>
      <div class="fu-stat medium"><div class="fu-num">${d.followUp?.medium||0}</div><div class="fu-lbl">本周</div></div>
      <div class="fu-stat low"><div class="fu-num">${d.followUp?.low||0}</div><div class="fu-lbl">关注</div></div>
    </div>
    ${(d.followUp?.list||[]).length > 0 ? `
    <div class="followup-list">
      <div class="fu-header">
        <span style="width:130px">手机号</span>
        <span style="width:90px">上次购买</span>
        <span style="width:90px">预计回访</span>
        <span style="width:50px">天</span>
        <span style="width:50px">级别</span>
      </div>
      ${(d.followUp?.list||[]).slice(0,10).map(f => `
      <div class="fu-row ${f.level||''}">
        <span style="width:130px;font-family:monospace">${f.phone||'-'}</span>
        <span style="width:90px;font-size:12px">${f.lastBuy||'-'}</span>
        <span style="width:90px;font-size:12px">${f.predicted||'-'}</span>
        <span style="width:50px;font-weight:600" class="${f.daysAgo>60?'mom-up':f.daysAgo>30?'':'mom-down'}">${f.daysAgo||0}天</span>
        <span style="width:50px" class="fu-badge fu-${f.level||''}">${f.urgency||''}</span>
      </div>`).join('')}
      ${(d.followUp?.list||[]).length > 10 ? `<div style="text-align:center;padding:8px;color:var(--text2);font-size:12px">... 共 ${d.followUp?.total||0} 条，仅显示前 10 条</div>` : ''}
    </div>
    ` : '<div style="text-align:center;color:var(--text2);padding:16px">暂无需要回访的客户</div>'}
  </div>
</div>
<div class="refresh-info">🕐 每60秒自动检查更新 · 版本 ${d.version||'-'}</div>
`;

  $('app').innerHTML = html;
}

function showError(msg) {
  $('app').innerHTML = `<div class="state-msg"><h2>😔 暂无数据</h2><p>${msg||'未找到该店员的数据'}</p></div>`;
}

async function loadData(userId) {
  try {
    const resp = await fetch(`data/${encodeURIComponent(userId)}.json`);
    if (!resp.ok) throw new Error('数据加载失败');
    render(await resp.json());
    return true;
  } catch(e) { showError('未找到该店员数据，请联系管理员'); return false; }
}

async function checkVersion() {
  let v = null;
  try { v = (await (await fetch(VERSION_URL+'?t='+Date.now())).json()).version; } catch(_) {}
  if (v && !checkVersion._last) checkVersion._last = v;
  else if (v && v !== checkVersion._last) { $('toast').classList.add('show'); setTimeout(()=>location.reload(),3000); }
}

(async function() {
  const uid = getParam('id');
  if (!uid) { showError('请在链接中添加 ?id=店员名字 参数'); return; }
  if (await loadData(uid)) { setInterval(checkVersion, POLL); }
})();
</script>
</body>
</html>
